name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every check lives in the repository's verify skill (plugins/verify/), so CI and an agent's
  # local run cannot drift apart: manifests, the version guard, references, server and hook tests.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # A plugin's version is the cache key consumers update against: content that changes
      # without a version bump never reaches them. The version guard compares with this base;
      # with none (a first push), it is skipped.
      - name: Run the full verify protocol
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi
          python3 plugins/verify/scripts/verify.py --full --base "$BASE_SHA"

  tag:
    name: Tag released plugin versions
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create missing <plugin>--v<version> tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            dir=$(dirname "$(dirname "$manifest")")
            name=$(jq -r '.name' "$manifest")
            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$version" ]; then
              echo "$name has no version, skipping"
              continue
            fi
            if git rev-parse -q --verify "refs/tags/$name--v$version" >/dev/null; then
              echo "$name--v$version already tagged"
              continue
            fi
            claude plugin tag "./$dir" --push
          done
